server:
  port: 8081

app:
  name: ToDoListApp
  version: 1.0
  api-version: "2.0.0"
  upload-dir: ${user.dir}/uploads

spring:
  profiles:
    active: dev
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: dev

logging:
  level:
    root: INFO

---
spring:
  config:
    activate:
      on-profile: prod

logging:
  level:
    root: WARN
